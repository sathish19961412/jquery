<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Jquery Selectors</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
       <div id="Element">Content</div>
       <div class="box">Content1</div>
       <div class="box">Content2</div>
       <p>pargraph1</p>
       <p>pargraph2</p>
       <form action="">
            <input type="text" placeholder="Enter Text">
            <input type="password" placeholder="Enter Password">
            <input type="text" name="username">
            <input type="email" name="email">
       </form>
       <a href="http://example.com">Example</a>
       <a href="http://example.org">Example Org</a>
       <a href="https://google.com">Example google</a>
       <div class="container">
         <p>Paragraph1</p>
         <p>Paragraph2</p>
       </div>
       <div class="parent">
         <p>Direct Child</p>
         <div>
            <p>Not a Direct Child</p>
         </div>
       </div>
       <script src="/1.setup/js/jquery-3.7.1.js"></script>
       <script>
          //ID Selector
          $('#Element').text('New Content');

          //Class Selector
          $('.box').css('background-color','yellow');

          //Element Selector
           //$('p').hide();

           //Attribute Selector
           $('[placeholder]').css('border','2px solid');

           //Value Selector
           $('[name="username"]').val('Default Username')

           //Partial value Selector
           $('a[href*="example"]').css('color','red')
           $('a[href^="https://google"]').css('color','green')

           //Descendant Selector
           $('.container p').css('color','blue')

           //Child Selector
           $('.parent > p').css('font-weight','bold')
       </script>
    </body>
</html>
