<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Dom Manipulation</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <style>
        .highlight{
            background:yellow;
        }
        .container{
            padding:20px;
            border: 1px solid #ccc;
        }
    </style>
    <body>
        <div id="content">Old HTML</div>
        <img id="logo" src="logo.png" alt="logo"/>
        <input type="text" id="inputfield" value="Old Value"/>
        <div id="parent">
            <p>Text 1</p>
        </div>
        <div id="toRemove">This will be Removed</div>
        <div id="box">Content</div>
        <div id="box2" class="highlight">Content 2</div>
        <div id="box3" >Content 3</div>
        <div id="box4" class="highlight">Content 4</div>
        <div class="container">
            <button id="myBtn">Click Me</button>
        </div>
        <h2>Sibling Highlight</h2>
        <div class="container">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item special">Item 3</div>
            <div class="item">Item 4</div>
        </div>
        <script src="/1.setup/js/jquery-3.7.1.js"></script>
       <script>
        //html()
         //$('#content').html('<p>New HTML Content</p>');

        //text()
        $('#content').text('New Text Content');

        //attr()
        $('#logo').attr('src','new-logo.png');
        $('#logo').attr('alt','NEW-LOGO');

        //val() 
        $('#inputfield').val('New Value');

        //append()
        $('#parent').append('<p>Text 2</p>');
         
         //prepend()
        $('#parent').prepend('<p>Text 0</p>');

        //remove()
        $(document).ready(function(){
           $('#toRemove').remove();
        })
        
        //addClass()
        $('#box').addClass('highlight');

        //removeClass()
        $('#box2').removeClass('highlight');

        //toggleClass()
        $('#box3').toggleClass('highlight')
        $('#box4').toggleClass('highlight')

        //parent()
        $(document).ready(function(){
            $('#myBtn').click(function(){
                  var parent1=$(this).parent();
                  parent1.toggleClass('highlight');
            })
        })

        //sibling()
        $(document).ready(function(){
            $('.item').click(function(){
                  var sibling=$(this).siblings();
                  sibling.toggleClass('highlight');
                  var special=$(this).siblings('.special');
                  special.css('background-color','red');
                  special.css('color','white');
            })
        })
       </script>
    </body>
</html>
